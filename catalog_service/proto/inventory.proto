syntax = "proto3";

package inventory;

service InventoryService {
  rpc CheckStock (StockCheckRequest) returns (StockCheckResponse);
  rpc ReleaseStock (ReleaseStockRequest) returns (ReleaseStockResponse);
  rpc CommitStock (CommitStockRequest) returns (CommitStockResponse);
  rpc InitProductItem (InitProductItemRequest) returns (InitProductItemResponse);
}

message StockCheckRequest {
  string product_id = 1;
  int32 requested_quantity = 2;
}

message StockCheckResponse {
  string product_id = 1;
  bool is_available = 2;
  int32 current_stock = 3;
  string error_message = 4;
}

message ReleaseStockRequest {
  string order_id = 1;
}

message ReleaseStockResponse {
  bool success = 1;
  string message = 2;
}

message CommitStockRequest {
  string order_id = 1;
}

message CommitStockResponse {
  bool success = 1;
  string message = 2;
}

message InitProductItemRequest {
  string product_id = 1;
  string sku = 2;
  int32 quantity = 3;
}

message InitProductItemResponse {
  bool success = 1;
  string message = 2;
}
