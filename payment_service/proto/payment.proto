syntax = "proto3";

package payment;

service PaymentService {
  rpc CreateCheckout (CheckoutRequest) returns (CheckoutResponse);
}

message CheckoutRequest {
  string order_id = 1;
  double amount = 2;
  string currency = 3;
  string return_url = 4;
  string cancel_url = 5;
  string tenant_id = 6;
  string user_id = 7;
}

message CheckoutResponse {
  bool success = 1;
  string checkout_url = 2;
  string payment_id = 3;
  string status = 4;
  string error_message = 5;
}
