apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: microservices
spec:
  type: ClusterIP
  $patch: replace
  ports:
    - port: 80
      targetPort: 80
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: admin-portal
  namespace: microservices
spec:
  type: ClusterIP
  $patch: replace
  ports:
    - port: 3000
      targetPort: 3000
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-site
  namespace: microservices
spec:
  type: ClusterIP
  $patch: replace
  ports:
    - port: 3001
      targetPort: 3001
      name: http
