apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-worker
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service-worker
  template:
    metadata:
      labels:
        app: order-service-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: worker
          image: micro_service-order_service_worker:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: SERVICE_TYPE
              value: "celery_worker"
            - name: POSTGRES_HOST
              value: "order-db"
            - name: POSTGRES_DB
              value: "order_db"
            - name: POSTGRES_USER
              value: "order_user"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: ORDER_POSTGRES_PASSWORD
          volumeMounts:
            - name: shared-keys
              mountPath: /shared_keys
      volumes:
        - name: shared-keys
          persistentVolumeClaim:
            claimName: shared-keys-pvc

