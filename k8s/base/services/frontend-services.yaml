apiVersion: v1
kind: Service
metadata:
  name: admin-portal
  namespace: microservices
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: admin-portal
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-site
  namespace: microservices
spec:
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  selector:
    app: storefront-site
