apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: microservices
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http-storefront
    - port: 81
      targetPort: 81
      nodePort: 30081
      name: http-admin
  selector:
    app: gateway
